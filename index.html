<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Global Video Feed</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="styles.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <div id="loading" class="progress-bar" role="progressbar" aria-label="Chargement" style="display: none;">
        <div class="progress-bar-fill"></div>
    </div>

    <header class="masthead">
        <div class="masthead-start">
            <button id="guide-button" class="icon-button guide-button" aria-label="Menu" title="Menu">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            </button>
            <a class="logo" href="./" aria-label="Global Video Feed, accueil">
                <svg class="logo-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8H6v7c0 1.1.9 2 2 2h9v-2H8V8zm12-5h-8c-1.1 0-2 .9-2 2v6c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 8h-8V7h8v4zM4 12H2v7c0 1.1.9 2 2 2h9v-2H4v-7z"/></svg>
                <span class="logo-text">Global Video Feed</span>
            </a>
        </div>

        <form class="masthead-center search" role="search" id="search-form">
            <input type="search" id="search-input" class="search-input" placeholder="Rechercher dans le fil" aria-label="Rechercher dans le fil" autocomplete="off">
            <button type="submit" class="search-button" aria-label="Rechercher" title="Rechercher">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </button>
        </form>

        <div class="masthead-end" id="auth-container">
            <button id="force-sync-button" class="icon-button" aria-label="Forcer la synchro" title="Forcer la synchro" style="display: none;">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            </button>
            <button id="manage-groups-button" class="icon-button" aria-label="Gérer les groupes" title="Gérer les groupes" style="display: none;">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 10H3v2h11v-2zm0-4H3v2h11V6zm4 8v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zM3 16h7v-2H3v2z"/></svg>
            </button>
            <button id="authorize-button" class="signin-button">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2a7.2 7.2 0 0 1-6-3.22c.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08a7.2 7.2 0 0 1-6 3.22z"/></svg>
                <span>Se connecter</span>
            </button>
            <div id="account" class="account" style="display: none;">
                <button id="account-button" class="avatar-button" aria-label="Compte" aria-haspopup="menu" aria-expanded="false">
                    <span id="account-avatar" class="avatar"></span>
                </button>
                <div id="account-menu" class="menu" role="menu" hidden>
                    <div class="menu-header">
                        <span id="account-menu-avatar" class="avatar avatar-large"></span>
                        <span id="account-name" class="menu-header-name"></span>
                    </div>
                    <button id="signout-button" class="menu-item" role="menuitem">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
                        <span>Se déconnecter</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <nav class="guide" aria-label="Navigation principale">
        <a class="guide-item active" href="./" aria-current="page">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span class="guide-label">Accueil</span>
        </a>
        <p id="stats" class="guide-footer" style="display: none;">
            <span id="sub-count">0</span> abonnements · <span id="video-count">0</span> vidéos
        </p>
    </nav>

    <main class="page">
        <div id="filters-bar" class="chips-bar" style="display: none;">
            <div id="filter-buttons" class="chips"></div>
        </div>

        <div id="subscriptions-grid" class="video-grid"></div>
    </main>

    <div id="error-message" class="toast" role="status" style="display: none;"></div>

    <!-- Groups Management Modal -->
    <div id="groups-modal" class="modal" style="display: none;">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="groups-modal-title">
            <div class="modal-header">
                <h2 id="groups-modal-title">Gérer les groupes</h2>
                <button id="close-modal" class="icon-button close-button" aria-label="Fermer" title="Fermer">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="group-name">Nom du groupe</label>
                    <input type="text" id="group-name" class="text-field" placeholder="Ex : Tech, Musique, Jeux vidéo…">
                </div>
                <div class="form-group">
                    <label>Chaînes</label>
                    <div id="channel-list" class="channel-list"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="save-group" class="primary-button">Créer le groupe</button>
            </div>
        </div>
    </div>

    <script src="js/main.js" type="module"></script>
</body>
</html>
